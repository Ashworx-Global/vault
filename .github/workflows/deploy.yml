# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job: build the vault into static HTML, then deploy it
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies (PIL for watermarking)
        run: pip install Pillow requests
      - name: Install ImageMagick (for PSD conversion)
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Convert PSD files to PNG (art gallery exports)
        run: python3 scripts/art_processor.py
      - name: Build static site (stdlib only, no npm)
        run: python3 scripts/build-site.py --base=/vault --out=site/dist
      - name: Rebuild under /vault/ so custom-domain URLs resolve
        # With a project site the repo name "/vault" is part of the URL, and
        # all baked links point there. A custom domain serves the same
        # artifact at the domain root, so "/vault/..." needs to exist inside
        # the artifact as a real subdirectory. Building a second copy there
        # makes both https://manofgod.online/vault/... and
        # https://ashworx-global.github.io/vault/... work unchanged.
        # NOTE: build-site.py only parses "--opt=value" (no space form).
        run: python3 scripts/build-site.py --base=/vault --out=site/dist/vault
      - name: Publish to Patreon and Facebook
        if: success()
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          PUBLISH_FACEBOOK: ${{ vars.PUBLISH_FACEBOOK || 'true' }}
        run: |
          echo "📢 Publishing Configuration:"
          echo "  PUBLISH_FACEBOOK=$PUBLISH_FACEBOOK"
          echo "  (Patreon API v2 is read-only - automation not supported)"
          echo ""
          python3 scripts/social_publisher.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the built site (not the whole repo)
          path: 'site/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
